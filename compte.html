<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mon compte | Les Délices De Pauline</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

<header class="site-header">

    <a href="index.html" class="logo">
        Les Délices De Pauline
    </a>

    <div>

        <button id="logoutButton" class="btn-secondary">

            <i class="fa-solid fa-right-from-bracket"></i>

            Déconnexion

        </button>

    </div>

</header>


<main class="account-page">

    <section class="account-container">

        <div class="account-welcome">

            <div class="account-avatar">

                <i class="fa-solid fa-user"></i>

            </div>

            <div>

                <p class="small-title">
                    Mon espace
                </p>

                <h1>
                    Bonjour <span id="userFirstName">...</span> 👋
                </h1>

                <p>
                    Retrouvez ici vos informations et vos commandes.
                </p>

            </div>

        </div>


        <div class="account-grid">

            <div class="account-card">

                <i class="fa-solid fa-user"></i>

                <h2>
                    Mes informations
                </h2>

                <p>
                    <strong>Nom :</strong>
                    <span id="userFullName">...</span>
                </p>

                <p>
                    <strong>E-mail :</strong>
                    <span id="userEmail">...</span>
                </p>

                <p>
                    <strong>Téléphone :</strong>
                    <span id="userPhone">...</span>
                </p>

            </div>


            <div class="account-card">

                <i class="fa-solid fa-basket-shopping"></i>

                <h2>
                    Mes commandes
                </h2>

                <div id="ordersContainer">

                    <p>
                        Chargement de vos commandes...
                    </p>

                </div>

            </div>

        </div>


        <div class="account-actions">

            <a href="index.html#produits"
               class="btn-primary">

                <i class="fa-solid fa-cookie-bite"></i>

                Découvrir nos produits

            </a>

            <a href="index.html#commande"
               class="btn-secondary">

                <i class="fa-solid fa-cart-shopping"></i>

                Commander

            </a>

        </div>

    </section>

</main>


<script src="auth.js"></script>

</body>
</html>
